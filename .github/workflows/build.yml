name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          ABC08F: ${{ secrets.ABC08F }}
          B4D6FB: ${{ secrets.B4D6FB }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('ABC08F', '')
          env_b = os.environ.get('B4D6FB', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 8ae8808be44409d48165cb74bdf814499496 -->', env_a)
          if env_b:
              result = result.replace('<!-- dfd343fa481dc132fc54e7785e29ec605226ca788bec7d -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
